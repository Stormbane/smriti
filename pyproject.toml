[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smriti"
version = "0.2.0"
description = "A memory system for AI entities, grounded in the antahkarana model of mind."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Suti" },
    { name = "Narada" },
]
keywords = ["memory", "ai", "agent", "rag", "identity", "vedanta", "antahkarana"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
smriti = "smriti.cli:main"

[project.optional-dependencies]
read = [
    "sqlite-vec>=0.1.1",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
]
api = [
    "anthropic>=0.40",
]
codex = [
    "tomli-w>=1.0",
]
private = [
    "cryptography>=42.0",
]
witness = [
    "opentimestamps>=0.4",
]
dev = [
    "pytest>=8.0",
    "ruff==0.15.8",  # pinned: lint results must not change with the release pip picks
    "mypy==1.11.2",  # pinned: type-check results must not change with the release pip picks
    "cryptography>=42.0",
    "sqlite-vec>=0.1.1",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "anthropic>=0.40",
    "tomli-w>=1.0",
    "opentimestamps>=0.4",
]

[project.urls]
Homepage = "https://github.com/Stormbane/smriti"

[tool.hatch.build.targets.wheel]
packages = ["src/smriti"]
# The eval corpus comes in once, through force-include below: hatchling refuses
# a file added twice, and the package selection would add it too.
exclude = ["src/smriti/eval/fixture"]

# Include the fictional eval corpus in wheels, including its nested dated files.
# And what the installer copies, kept at the top of the checkout: a wheel
# carries them under smriti/_data/ at the same paths, where
# smriti.install.templates finds them (tests/test_install_templates.py holds
# this table to its list).
[tool.hatch.build.targets.wheel.force-include]
"src/smriti/eval/fixture" = "smriti/eval/fixture"
"narada/.smriti" = "smriti/_data/narada/.smriti"
"memory_template" = "smriti/_data/memory_template"
"docs/PRIVACY.md" = "smriti/_data/docs/PRIVACY.md"

[tool.pytest.ini_options]
markers = [
    "needs_model: requires semantic embedding quality; skipped with SMRITI_EMBED_PROVIDER=stub",
    "needs_cli: runs the installed Claude Code CLI (a few cents on haiku); opt-in with SMRITI_LIVE_CLI_TESTS=1, and skipped in CI or when `claude` is missing or logged out",
    "slow: perf regression guards — run with `pytest -m slow`. Excluded from default runs to keep `pytest` fast.",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stated, not inherited: ruff's default rule set changes between releases.
# E501 enforces the line length; B (bugbear) catches likely bugs; BLE flags
# blind excepts: narrow one, or keep it with `# noqa: BLE001 — <reason>`.
select = ["E4", "E7", "E9", "F", "E501", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Vendored third-party code (memsearch, MIT) stays close to upstream, so it
# is not restyled: it is exempt from the rules added for our own code only.
"src/smriti/_vendored/**" = ["E501", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
strict = true
# The vendored code is third-party: not checked as a source (that would
# also parse numpy's stubs, which use syntax newer than python_version).
exclude = ["^src/smriti/_vendored/"]

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party vendored sources are preserved upstream; strict checks cover our code.
module = "smriti._vendored.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
# The optional OpenAI provider SDK is not installed by the read/dev extras.
module = ["openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The ML stack behind the embedders: never followed. Their stubs track their
# own releases (numpy 2.4's use 3.12-only syntax), so the check would change
# with the versions pip picks; smriti treats them as Any at its boundary.
module = ["numpy", "numpy.*", "huggingface_hub", "huggingface_hub.*", "torch",
          "torch.*", "transformers", "transformers.*", "sentence_transformers",
          "sentence_transformers.*", "onnxruntime", "onnxruntime.*", "tokenizers",
          "tokenizers.*"]
follow_imports = "skip"
ignore_missing_imports = true
