name: Quality with real models

# Weekly, and on demand (H12.9): what the stub embedder in CI can't show.
# The needs_model tests and `smriti eval`'s quality set run with the real
# embedding model, gpahal/bge-m3-onnx-int8 (about 560 MB, cached between
# runs); the scores go to the job summary and an artifact. The digest
# measures (`smriti eval --llm`) need a real LLM and run locally only.
"on":
  schedule:
    - cron: "17 5 * * 1"  # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    name: needs_model tests and the quality set (bge-m3, onnx)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_TELEMETRY: "1"
      # SMRITI_EMBED_PROVIDER is unset, so the real model is used: onnx comes
      # first in the auto order. HF_HUB_OFFLINE is unset, so a cache miss downloads.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[read,dev]"
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--gpahal--bge-m3-onnx-int8
          key: hf-gpahal--bge-m3-onnx-int8-v1
      - name: The needs_model tests
        run: pytest -q -m needs_model tests -rs --junitxml=needs_model.xml
      - name: None of them was skipped
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse("needs_model.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{tests} needs_model tests, {skipped} skipped")
          sys.exit("a needs_model test was skipped or none ran" if skipped or not tests else 0)
      - name: The quality set
        run: smriti eval --markdown --baseline eval.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.sha }}
          path: eval.json
