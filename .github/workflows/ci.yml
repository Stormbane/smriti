name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # Every extra has 3.13 wheels on all three (checked 2026-11-07).
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Branch coverage of src/smriti is reported on every job. Each OS and
          # Python takes other branches and skips other tests, so the floor holds
          # on the job it was measured on, a couple of points under it (H12.16:
          # 81.8% on Windows, 3.12, 2026-11-07, lines and branches together).
          - os: windows-latest
            python-version: "3.12"
            cov_floor: 79
    env:
      PYTHONPATH: src
      SMRITI_EMBED_PROVIDER: stub
      # Search may also try the optional reranker. Never fetch models in CI.
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The reference profile is its own package (profiles/reference/); its
        # tests run here too, but it never enters smriti's wheel (see below).
        run: python -m pip install -e ".[read,dev]" -e profiles/reference
      - name: Lint
        run: ruff check src tests scripts profiles
      - name: Type check
        run: mypy --strict src/smriti profiles/reference/src
      - name: Test
        run: >-
          pytest -q --ignore=tests/test_perf.py --cov --cov-report=term
          --cov-fail-under=${{ matrix.cov_floor || 0 }} tests profiles/reference/tests
      - name: The core wheel carries no reference code
        shell: python
        run: |
          import pathlib, subprocess, sys, zipfile
          subprocess.run([sys.executable, "-m", "pip", "wheel", ".", "--no-deps", "-w", "dist"],
                         check=True)
          wheels = list(pathlib.Path("dist").glob("smriti-*.whl"))
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          bad = [n for n in names if "reference" in n.lower()]
          print(f"{wheels[0].name}: {len(names)} members")
          sys.exit(f"reference code in the core wheel: {bad}" if bad else 0)

  wheel:
    # The wheel on its own (H12.4): built, installed in a fresh venv with no
    # checkout on the path and no PYTHONPATH, set up by its installer in a
    # temporary home, then write, read, status and one nightly with the stub
    # embedder and the canned test_stub LLM. scripts/wheel_smoke.py says what
    # each step checks; it runs smriti only from the job's temp directory.
    name: wheel smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w "${{ runner.temp }}/dist"
      - name: Install it in a fresh venv and run smriti from there
        working-directory: ${{ runner.temp }}
        shell: bash
        run: python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" dist/smriti-*.whl --work smoke
