name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
      SMRITI_EMBED_PROVIDER: stub
      # Search may also try the optional reranker. Never fetch models in CI.
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[read,dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy --strict src/smriti/core src/smriti/store src/smriti/daylog src/smriti/wake src/smriti/mcp src/smriti/profiles
      - name: Test
        run: pytest -q --ignore=tests/test_perf.py
